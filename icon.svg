<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' role='img' aria-labelledby='icon-title'>
<title id='icon-title'>Unicon the unicorn: a pink pony whose horn is sliced off flat halfway up.</title>
<!--
  The hero mascot cropped to the head and scaled to 28.57%, so the two cannot drift:
  every path below is the one in index.html, at the same coordinates. What differs is
  what a 16-pixel tab can carry — the lower mane, the halo, the eyelashes, the horn's
  shading rings and the sparkle are dropped, and every stroke is doubled to survive
  the scale. Set `rx` to 0 for the Apple touch icon: iOS applies its own mask, and a
  corner rounded twice reads as a mistake.
-->
<defs>
  <linearGradient id='bg' x1='0' y1='0' x2='0.6' y2='1'>
    <stop offset='0%' stop-color='#FF8CC6'/>
    <stop offset='100%' stop-color='#E8489A'/>
  </linearGradient>
  <linearGradient id='mane' x1='0' y1='0' x2='0.9' y2='1'>
    <stop offset='0%' stop-color='#FFA9D2'/>
    <stop offset='52%' stop-color='#C9A6FF'/>
    <stop offset='100%' stop-color='#9BE8D8'/>
  </linearGradient>
  <linearGradient id='hornshade' x1='0' y1='1' x2='0' y2='0'>
    <stop offset='0%' stop-color='#FF9BC8'/>
    <stop offset='100%' stop-color='#FFD173'/>
  </linearGradient>
</defs>

<rect width='64' height='64' rx='14' fill='url(#bg)'/>

<g transform='translate(-5.14 -6.15) scale(0.2857)'>
  <g fill='#5C1B3D'>
    <circle cx='72' cy='118' r='33'/><circle cx='188' cy='118' r='33'/>
    <circle cx='100' cy='86' r='29'/><circle cx='160' cy='86' r='29'/>
    <circle cx='130' cy='76' r='27'/>
  </g>
  <g fill='url(#mane)'>
    <circle cx='72' cy='118' r='29'/><circle cx='188' cy='118' r='29'/>
    <circle cx='100' cy='86' r='25'/><circle cx='160' cy='86' r='25'/>
    <circle cx='130' cy='76' r='23'/>
  </g>

  <g fill='#FFE7F1' stroke='#5C1B3D' stroke-width='7' stroke-linejoin='round'>
    <path d='M96 104C80 88 70 66 77 53c16 8 27 29 33 47z'/>
    <path d='M164 104c16-16 26-38 19-51-16 8-27 29-33 47z'/>
  </g>

  <ellipse cx='130' cy='154' rx='66' ry='62' fill='#FFE7F1' stroke='#5C1B3D' stroke-width='7'/>

  <g fill='url(#mane)' stroke='#5C1B3D' stroke-width='7' stroke-linejoin='round'>
    <path d='M96 120c-2-20 4-34 16-42-4 16-4 28 1 42z'/>
    <path d='M147 120c6-18 16-30 29-34-11 13-16 23-16 34z'/>
  </g>

  <g stroke='#5C1B3D' stroke-width='7' stroke-linejoin='round'>
    <path d='M114 108 121 54h18l7 54z' fill='url(#hornshade)'/>
    <ellipse cx='130' cy='54' rx='9' ry='3.6' fill='#FFD173'/>
  </g>

  <g fill='#5C1B3D'>
    <ellipse cx='104' cy='160' rx='15' ry='18.5'/>
    <ellipse cx='156' cy='160' rx='15' ry='18.5'/>
  </g>
  <g fill='#FFFFFF'>
    <circle cx='99' cy='153' r='6'/><circle cx='151' cy='153' r='6'/>
  </g>

  <g fill='#FFA9D2' opacity='0.65'>
    <ellipse cx='82' cy='182' rx='13' ry='8'/><ellipse cx='178' cy='182' rx='13' ry='8'/>
  </g>

  <ellipse cx='130' cy='192' rx='32' ry='22' fill='#FFD2E5'/>
  <path d='M119 200c4 6 8 8 11 8s7-2 11-8' fill='none' stroke='#5C1B3D' stroke-width='6.5'
        stroke-linecap='round'/>
</g>
</svg>
